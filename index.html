<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영상 프레임 추출기</title>
<style>
  body{font-family:-apple-system,"Apple SD Gothic Neo",sans-serif;max-width:900px;margin:0 auto;padding:24px 16px;background:#fafafa;color:#222}
  h1{font-size:20px}
  #drop{border:2px dashed #aaa;border-radius:12px;padding:32px;text-align:center;cursor:pointer;background:#fff}
  #drop.over{border-color:#7d2ae8;background:#f5eeff}
  video{width:100%;max-height:60vh;background:#000;border-radius:8px;margin-top:16px;display:none}
  #ctrl{display:none;margin-top:12px}
  input[type=range]{width:100%}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  button{padding:8px 14px;border:1px solid #ccc;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
  button.primary{background:#7d2ae8;color:#fff;border-color:#7d2ae8}
  #info{font-variant-numeric:tabular-nums;color:#555;font-size:14px}
  input[type=number]{width:90px;padding:6px}
</style>
</head>
<body>
<h1>영상 프레임 → PNG</h1>
<div id="drop">MP4 영상을 여기에 끌어놓거나 클릭해서 선택<input id="file" type="file" accept="video/*" hidden></div>
<video id="v" controls muted playsinline></video>
<div id="ctrl">
  <input id="seek" type="range" min="0" value="0" step="any">
  <div class="row">
    <button id="back">◀ 이전 프레임</button>
    <button id="fwd">다음 프레임 ▶</button>
    <label>이동(초) <input id="t" type="number" min="0" step="0.01"></label>
    <button id="go">이동</button>
    <button id="save" class="primary">현재 프레임 PNG 저장</button>
  </div>
  <div class="row"><span id="info"></span></div>
  <div class="row" style="color:#888;font-size:13px">단축키: ←/→ 프레임 이동, S 저장, 스페이스 재생/정지</div>
</div>
<script>
const $=id=>document.getElementById(id);
const v=$('v'),seek=$('seek'),info=$('info'),t=$('t');
let fps=30,name='video';
const drop=$('drop'),file=$('file');
drop.onclick=()=>file.click();
file.onchange=()=>file.files[0]&&load(file.files[0]);
drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};
drop.ondragleave=()=>drop.classList.remove('over');
drop.ondrop=e=>{e.preventDefault();drop.classList.remove('over');e.dataTransfer.files[0]&&load(e.dataTransfer.files[0])};

function load(f){
  name=f.name.replace(/\.[^.]+$/,'');
  v.src=URL.createObjectURL(f);
  v.style.display='block';$('ctrl').style.display='block';
  v.onloadedmetadata=()=>{seek.max=v.duration;estimateFps();update()};
}
// 실제 프레임레이트 추정 (재생 중 프레임 콜백 간격 측정)
function estimateFps(){
  if(!v.requestVideoFrameCallback)return;
  const times=[];
  const cb=(now,m)=>{
    times.push(m.mediaTime);
    if(times.length<12){v.requestVideoFrameCallback(cb)}
    else{
      v.pause();
      const d=(times[times.length-1]-times[1])/(times.length-2);
      if(d>0)fps=Math.round(1/d*100)/100;
      v.currentTime=0;update();
    }
  };
  v.requestVideoFrameCallback(cb);
  v.play().catch(()=>{});
}
function update(){
  seek.value=v.currentTime;t.value=v.currentTime.toFixed(2);
  info.textContent=`${v.currentTime.toFixed(3)}s / ${v.duration.toFixed(2)}s · 프레임 ${Math.round(v.currentTime*fps)} · ${v.videoWidth}×${v.videoHeight} · 약 ${fps}fps`;
}
function step(n){v.pause();v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+n/fps))}
v.ontimeupdate=update;v.onseeked=update;
seek.oninput=()=>{v.pause();v.currentTime=+seek.value};
$('back').onclick=()=>step(-1);
$('fwd').onclick=()=>step(1);
$('go').onclick=()=>{v.pause();v.currentTime=+t.value};
function save(){
  const c=document.createElement('canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);
    a.download=`${name}_${v.currentTime.toFixed(2)}s.png`;
    a.click();URL.revokeObjectURL(a.href);
  },'image/png');
}
$('save').onclick=save;
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.type==='number')return;
  if(!v.src)return;
  if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}
  else if(e.key==='ArrowRight'){e.preventDefault();step(1)}
  else if(e.key==='s'||e.key==='S')save();
  else if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()}
});
</script>
</body>
</html>
